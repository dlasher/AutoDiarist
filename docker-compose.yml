# =============================================================================
# AutoDiarist — NVIDIA CUDA host (T400 reference, sm_75; CUDA-13 runtime).
# For an AMD/Vulkan GPU (RX 6600 class, amdgpu + Mesa RADV) use
# docker-compose.amd.yml instead — same repo, same Dockerfile, other file.
#
# ONE COMMAND, ZERO EDITS (packaging card t_f82ad22a):
#     git clone https://github.com/dlasher/AutoDiarist.git autodiarist
#     cd autodiarist
#     docker compose up --build
#
# No .env is required: every optional knob below carries an inline default
# (${VAR:-default}), and docker compose resolves a fresh clone with no .env
# present. env_file was removed for exactly this reason. .env.example
# documents the knobs you MAY override.
# =============================================================================
services:
  autodiarist:
    build:
      context: .
      args:
        # One Dockerfile, two hardware targets — this file pins the CUDA
        # path: CUDA-13 apt libs + the cuda13 engine asset + the nvidia
        # device reservation below, identical to the pre-ARG build.
        GPU_BACKEND: cuda
    image: autodiarist:local
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      JOBS_DIR: /data/jobs
      MOCK_PIPELINE: ${MOCK_PIPELINE:-0}
      # Pinned backend contract (pipeline/transcribe.py). CRISPASR_GPU_BACKEND
      # stays literal "cuda": the crispasr CLI silently falls back to CPU when
      # libcudart/libcublas are missing, and the --version probe must fail
      # fast on that instead of spending minutes per job.
      CRISPASR_BIN: ${CRISPASR_BIN:-/opt/crispasr/crispasr}
      GGUF_MODEL: ${GGUF_MODEL:-/opt/models/nemotron-3.5-asr-streaming-0.6b-q4_k.gguf}
      CRISPASR_LIB_DIR: ${CRISPASR_LIB_DIR:-/usr/local/cuda-13.0/targets/x86_64-linux/lib}
      CRISPASR_GPU_BACKEND: cuda
      # Diarization (card t_5a287979): sherpa = external sherpa-onnx
      # subprocess (segmentation + speaker embedding + clustering) -- the
      # engine's "reliable diarization" path. foxnose's global BIC counter
      # collapses panel recordings (5 speakers -> 1, cosine single-speaker
      # veto on the 249s NASA SEWP file); sherpa separates them correctly.
      # The two ONNX models are baked into the image (/opt/models); if they
      # are absent the service REFUSES to start instead of silently
      # emitting one speaker (pipeline/transcribe.py AC4 guard).
      DIAR_METHOD: sherpa
      SHERPA_SEGMENT_MODEL: ${SHERPA_SEGMENT_MODEL:-/opt/models/sherpa-onnx-reverb-diarization-v1.onnx}
      SHERPA_EMBEDDING_MODEL: ${SHERPA_EMBEDDING_MODEL:-/opt/models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx}
      # wrapper injects --clustering.cluster-threshold (the engine has no
      # flag for it; it is the knob that sets how many speakers
      # FastClustering emits). Override SHERPA_CLUSTER_THRESHOLD to tune.
      SHERPA_BIN: ${SHERPA_BIN:-/opt/sherpa/sherpa-diarization-wrapper}
      SHERPA_CLUSTER_THRESHOLD: ${SHERPA_CLUSTER_THRESHOLD:-0.40}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-8}
      VRAM_LIMIT_MIB: ${VRAM_LIMIT_MIB:-3584}
      CRISPASR_TIMEOUT_SECONDS: ${CRISPASR_TIMEOUT_SECONDS:-1800}
      # Domain vocabulary pass (card t_72405565). ON by default — the image
      # bakes /app/vocab.txt with the NASA/SEWP terms measured mangled at
      # Q4_K. SPELL_CHECK=0/off opts out; VOCAB_PATH overrides the vocabulary.
      SPELL_CHECK: "1"
      # Retention + disk-pressure (card t_5e6200fc). Defaults match
      # api/main.py; the watermark must fit the volume backing /data/jobs.
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      DISK_MIN_FREE_MIB: ${DISK_MIN_FREE_MIB:-8192}
      DISK_CHECK_INTERVAL_SECONDS: ${DISK_CHECK_INTERVAL_SECONDS:-300}
    volumes:
      # engine embedders (--diarize-embedder auto) + any --auto-download
      # artifacts persist here;
      # the Q4_K GGUF itself is baked into the image at /opt/models.
      - crispasr-cache:/var/cache/crispasr
      - jobs-data:/data/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  crispasr-cache:
  jobs-data:
